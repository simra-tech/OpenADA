[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openada"
version = "0.4.0"
description = "Open agent-EDA contracts and deterministic drivers for open-source EDA tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Simra Tech" },
]
keywords = ["eda", "agents", "xschem", "ngspice", "xyce", "klayout", "netgen", "verilator", "yosys", "opensta"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "jsonschema>=4.18",
]

[project.urls]
Homepage = "https://github.com/simra-tech/OpenADA"
Repository = "https://github.com/simra-tech/OpenADA"
Issues = "https://github.com/simra-tech/OpenADA/issues"

[project.scripts]
openada = "openada.cli:main"
openada-provider-ngspice = "openada.providers.ngspice_pdk_control:main"

[project.optional-dependencies]
conformance = [
  "cryptography>=38",
  "jsonschema>=4.18",
  "pytest>=8",
]
dev = [
  "build>=1.2",
  "cryptography>=38",
  "jsonschema>=4.18",
  "pytest>=8",
  "tomli>=1.1; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/openada/schemas" = [
  "schemas/driver-manifest-v0alpha1.schema.json",
  "schemas/operation-profile-v0alpha1.schema.json",
  "schemas/operation-profile-v0alpha2.schema.json",
  "schemas/request-v0alpha1.schema.json",
  "schemas/result-v0alpha1.schema.json",
  "schemas/design-provenance-v0alpha1.schema.json",
  "schemas/semantic-chain-manifest-v0alpha1.schema.json",
  "schemas/semantic-chain-run-v0alpha1.schema.json",
  "schemas/semantic-surface-catalog-v0alpha1.schema.json",
  "schemas/behavioral-block-v0alpha1.schema.json",
  "schemas/behavioral-block-library-v0alpha1.schema.json",
]
"share/openada/runtime/cosim" = [
  "runtime/cosim/openada_verilator_shim.cpp",
  "runtime/cosim/openada_verilator_main.cpp",
]
"share/openada/catalog" = [
  "catalog/semantic-surfaces-v0alpha1.json",
]
"share/openada/profiles" = [
  "profiles/circuit.simulate-v1alpha1.json",
  "profiles/circuit.simulate-v1alpha2.json",
  "profiles/logic.synthesize-v1alpha1.json",
  "profiles/result.measure-v1alpha1.json",
  "profiles/result.series.extract-v1alpha1.json",
  "profiles/result.spectral.measure-v1alpha1.json",
  "profiles/result.transfer.measure-v1alpha1.json",
  "profiles/rtl.lint-v1alpha1.json",
  "profiles/rtl.test-v1alpha1.json",
  "profiles/specification.evaluate-v1alpha1.json",
  "profiles/testbench.simulate-v1alpha1.json",
  "profiles/timing.analyze-v1alpha1.json",
]
"share/openada/providers/ngspice-pdk-control" = [
  "providers/ngspice-pdk-control/driver-manifest.json",
  "providers/ngspice-pdk-control/provider-config-v0alpha1.schema.json",
]
"share/openada/blocks/bhv-core" = [
  "blocks/bhv-core/library-manifest.json",
]
"share/openada/blocks/bhv-core/blocks/comparator_clocked" = [
  "blocks/bhv-core/blocks/comparator_clocked/block.json",
  "blocks/bhv-core/blocks/comparator_clocked/comparator_clocked.ngspice.sp",
  "blocks/bhv-core/blocks/comparator_clocked/comparator_clocked.va",
  "blocks/bhv-core/blocks/comparator_clocked/comparator_clocked.cosim.sp",
  "blocks/bhv-core/blocks/comparator_clocked/comparator_clocked.cosim.v",
]
"share/openada/blocks/bhv-core/blocks/comparator_clocked/cases" = [
  "blocks/bhv-core/blocks/comparator_clocked/cases/ambiguity-low.json",
  "blocks/bhv-core/blocks/comparator_clocked/cases/decide-basic.json",
  "blocks/bhv-core/blocks/comparator_clocked/cases/hysteresis-band.json",
]
"share/openada/blocks/bhv-core/blocks/comparator_clocked_phys" = [
  "blocks/bhv-core/blocks/comparator_clocked_phys/block.json",
  "blocks/bhv-core/blocks/comparator_clocked_phys/comparator_clocked_phys.va",
]
"share/openada/blocks/bhv-core/blocks/comparator_clocked_phys/cases" = [
  "blocks/bhv-core/blocks/comparator_clocked_phys/cases/ambiguity-low.json",
  "blocks/bhv-core/blocks/comparator_clocked_phys/cases/decide-basic.json",
  "blocks/bhv-core/blocks/comparator_clocked_phys/cases/hysteresis-band.json",
]
"share/openada/blocks/bhv-core/blocks/opamp_1p" = [
  "blocks/bhv-core/blocks/opamp_1p/block.json",
  "blocks/bhv-core/blocks/opamp_1p/opamp_1p.ngspice.sp",
  "blocks/bhv-core/blocks/opamp_1p/opamp_1p.va",
]
"share/openada/blocks/bhv-core/blocks/opamp_1p/cases" = [
  "blocks/bhv-core/blocks/opamp_1p/cases/gain-gbw.json",
  "blocks/bhv-core/blocks/opamp_1p/cases/slew-sat.json",
]
"share/openada/blocks/bhv-core/blocks/sw_bbm_pair" = [
  "blocks/bhv-core/blocks/sw_bbm_pair/block.json",
  "blocks/bhv-core/blocks/sw_bbm_pair/sw_bbm_pair.ngspice.sp",
  "blocks/bhv-core/blocks/sw_bbm_pair/sw_bbm_pair.va",
  "blocks/bhv-core/blocks/sw_bbm_pair/sw_bbm_pair.cosim.sp",
  "blocks/bhv-core/blocks/sw_bbm_pair/sw_bbm_pair.cosim.v",
]
"share/openada/blocks/bhv-core/blocks/sw_bbm_pair/cases" = [
  "blocks/bhv-core/blocks/sw_bbm_pair/cases/bbm-conductance.json",
  "blocks/bhv-core/blocks/sw_bbm_pair/cases/buck-sync.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "conformance: opt-in tests that require the pinned external EDA runtime and design",
]
